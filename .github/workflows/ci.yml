name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-22.04
  
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install GCC 11
        run: sudo apt-get update && sudo apt-get install -y gcc-11 g++-11

      - name: Configure CMake
        run: cmake -B build -DCMAKE_C_COMPILER=gcc-11 -DCMAKE_CXX_COMPILER=g++-11

      - name: Build
        run: cmake --build build

      - name: Run tests
        run: ctest --test-dir tests --output-on-failure